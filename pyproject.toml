[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholardex"
version = "1.1.0"
description = "AI-powered research paper search and summarization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Paras"}
]
dependencies = [
    "google-genai>=1.0.0",
    "scholarly>=1.7.11",
    "arxiv>=2.1.0",
    "requests>=2.31",
    "PyMuPDF>=1.24.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "toml>=0.10.2"
]

[project.scripts]
scholardex = "scholardex.cli:app"

[tool.setuptools.packages.find]
include = ["scholardex*"]
